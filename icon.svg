  <title id="ttl">Pixel Shooter 32px 桌面图标</title>
  <desc id="dsc">32x32 原生像素网格：绿色飞船向上发射黄色子弹击中红色像素怪，配色取自 PixelShooter.java，四角透明圆角底板。</desc>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#0A0C18" stroke="#33436B" stroke-width="1"/>

  <!-- 深空星点 -->
  <rect x="7" y="7" width="1" height="1" fill="#2D375A"/>
