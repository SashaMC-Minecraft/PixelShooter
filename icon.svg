  <!-- 亮星与十字光芒 -->
  <rect x="8" y="10" width="1" height="1" fill="#96AAD2"/>
  <rect x="24" y="7" width="1" height="1" fill="#96AAD2"/>
  <rect x="11" y="14" width="1" height="1" fill="#96AAD2"/>
  <rect x="21" y="19" width="1" height="1" fill="#96AAD2"/>
