  <rect x="14" y="20" width="4" height="3" fill="#3CDC82"/>
  <rect x="11" y="23" width="10" height="3" fill="#3CDC82"/>
  <rect x="11" y="25" width="10" height="1" fill="#229E62"/>
  <rect x="15" y="23" width="2" height="2" fill="#E6FFF0"/>
  <rect x="10" y="24" width="1" height="2" fill="#229E62"/>
