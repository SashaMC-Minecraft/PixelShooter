name: Build macOS Packages

on:
  workflow_dispatch:

jobs:
  macos-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: AppleSilicon
          - os: macos-13
            arch: Intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      ASSET: PixelShooter-macOS-${{ matrix.arch }}-v2.0.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile and package jar
        run: |
          mkdir -p build/classes pkg-in out
          javac -encoding UTF-8 -d build/classes src/PixelShooter.java
          jar --create --file pkg-in/PixelShooter.jar --main-class PixelShooter -C build/classes .

      - name: Build .app bundle
        run: |
          jpackage --type app-image \
            --name PixelShooter --app-version 2.0 \
            --input pkg-in --main-jar PixelShooter.jar --main-class PixelShooter \
            --vendor "SashaMC-Minecraft" \
            --java-options "-Dsun.java2d.uiScale=1.0" \
            --dest out
          ls -la out/

      - name: Zip app bundle
        run: |
          cd out
          ditto -c -k --sequesterRsrc --keepParent PixelShooter.app "$ASSET"
          ls -la

      - name: Upload asset to Release v2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.0 "out/$ASSET" --clobber
          echo "uploaded: $ASSET"
