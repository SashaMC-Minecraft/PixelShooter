name: Build macOS Packages

on:
  workflow_dispatch:

jobs:
  macos-packages:
    # Intel Mac 暂不提供，仅构建 Apple Silicon 版本
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile and package jar
        run: |
          mkdir -p build/classes pkg-in out
          javac -encoding UTF-8 -d build/classes src/PixelShooter.java
          jar --create --file pkg-in/PixelShooter.jar --main-class PixelShooter -C build/classes .

      - name: Build .app bundle
        run: |
          jpackage --type app-image \
            --name PixelShooter --app-version 2.1 \
            --input pkg-in --main-jar PixelShooter.jar --main-class PixelShooter \
            --vendor "SashaMC-Minecraft" \
            --java-options "-Dsun.java2d.uiScale=1.0" \
            --dest out
          ls -la out/

      - name: Zip app bundle
        run: |
          cd out
          ditto -c -k --sequesterRsrc --keepParent PixelShooter.app PixelShooter-macOS-AppleSilicon-v2.1.zip
          ls -la

      - name: Upload asset to Release v2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.1 "out/PixelShooter-macOS-AppleSilicon-v2.1.zip" --clobber
          echo "uploaded PixelShooter-macOS-AppleSilicon-v2.1.zip"
